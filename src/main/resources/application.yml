server:
    port: 8080

spring:
  application:
    name: smartstore

  datasource:
    url: jdbc:mysql://localhost:3306/smartstore
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

  flyway:
    enabled: true
    baseline-on-migrate: true  # 기존 DB가 있을 때 충돌 방지
    locations: classpath:db/migration